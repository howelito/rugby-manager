 MGS={"mind":["Mind-games merchant",["I said all week they would crack. I am rarely wrong about these things.","Everything went exactly as I planned it on Tuesday.","They were beaten before they got off the bus.","I could see it in their eyes in the warm-up.","I knew their game plan before they did.","Some coaches prepare for matches. I prepare for coaches."],["We let them have that one. It is all part of a longer plan.","I learned a great deal about them today. They will regret that.","Let them enjoy it. They will not enjoy the return fixture.","I wanted to see how they handle winning. Badly, as it turns out.","That result suits me more than you might think.","Losing today was not in the plan, but the plan is flexible."],["I hear their dressing room is not a happy place. Just what I hear.","The pressure is all on them. I would hate to be in their shoes.","I wonder if their coach is sleeping well this week.","They say they are confident. People who are confident do not say it.","I have a surprise for them. I will not say what.","Their captain looked nervous at the coin toss last time. I notice these things."]],"old":["Old-school disciplinarian",["Proper rugby wins matches. None of this fancy stuff.","Win your scrum, win your lineout, win the game. It is not complicated.","That is what happens when you tackle.","Forwards win matches. Backs decide by how many.","We did the basics. The basics have never let me down.","Nobody wore gloves. I was proud of them."],["My lot will be running hills at six tomorrow morning.","There will be no days off this week. Possibly this month.","Some of them have played their last game for this club.","I have seen more fight in a school second fifteen.","We were soft. I do not coach soft teams.","They can walk home."],["They are soft. We will find out on the day.","I have no interest in what they do. We will do what we do.","It will be decided up front, like every game of rugby ever played.","We will see how they like it when it rains.","  not need to.","They should enjoy the warm-up. It gets worse from there.","If we play at seventy per cent we win by twenty.","Their coach is a nice lad. Nice lads finish fifth."]],"gent":["Gentleman of the game",["Credit to them, they made us work for every point.","We were fortunate today. They deserved more from the game.","A fine contest between two good sides. I am glad we edged it.","Their young players were a credit to the club.","I thought the referee had an excellent game.","We will enjoy it quietly. They will be back."],["They were the better side. I will buy their coach a pint.","No complaints at all. We were beaten by a very good team.","I shook every one of their hands. They earned it.","Sometimes you simply have to applaud.","That is a properly coached side. Well done to them.","We will learn from it and wish them well."],["I have nothing but respect for what they are building over there.","It should be a wonderful occasion for both sets of supporters.","Their coach is doing a superb job. I say so often.","May the better side win, and I hope it is a good game.","We will have to be at our very best.","I am looking forward to a drink with them afterwards, whatever happens."]],"grump":["Touchline grump",["We won. I suppose that will have to do.","It was adequate.","I have nothing to add. We scored more points.","I will find something to be annoyed about by Monday.","The second half was tolerable.","Do not expect me to smile about it."],["I have seen better organised car boot sales.","I am not angry. I am past angry.","Ask the players. I am going home.","That was eighty minutes of my life I will not get back.","We were rubbish. You can print that.","I have no comment, and that is my comment."],["I do not do predictions. I barely do press conferences.","It is a game of rugby. It will last eighty minutes. That is all I know.","Is this going to take long?","They have fifteen players. So have we.","I will tell you afterwards.","Next question. Actually, no more
